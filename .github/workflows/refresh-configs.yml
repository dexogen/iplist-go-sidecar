name: Refresh configs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-configs.yml"
      - "tools/update-configs.py"
      - "README.md"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-configs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configs
        run: python tools/update-configs.py

      - name: Commit changes
        shell: bash
        run: |
          git status --short
          if [ -z "$(git status --porcelain -- config)" ]; then
            echo "configs are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          git commit -m "Refresh collected configs"
          git push
